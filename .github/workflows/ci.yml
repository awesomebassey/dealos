name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dealos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dealos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dealos?schema=public
      NEXT_PUBLIC_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - uses: actions/upload-artifact@v4
        with:
          name: generated-lockfile
          path: package-lock.json
          retention-days: 1
      - name: Commit regenerated lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh dependency lockfile"
          git push origin HEAD:${{ github.head_ref }}
      - run: npm run db:generate
      - run: npm run db:push
      - run: npm run db:seed
      - run: npm run test:static
      - run: npm run test
      - run: npm run build
