name: CI

on:
  pull_request:
  push:
    branches: [main]


jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dealos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dealos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dealos?schema=public
      NEXT_PUBLIC_API_URL: http://localhost:4000
      DEALOS_DEMO_VERIFICATION_ENABLED: "true"
      DEALOS_DEMO_DOCUMENTS_ENABLED: "true"
      DEALOS_DEMO_FINANCE_ENABLED: "true"
      DEALOS_ALLOW_DESTRUCTIVE_SEED: "true"
      DEALOS_SEED_LISTING_COUNT: "100"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run db:generate
      - run: npm run db:push
      - run: npm run db:seed
      - run: npm run test:static
      - run: npm run test
      - run: npm run build
      - run: npm run test:smoke
