services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dealos
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dealos"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - dealos_pg:/var/lib/postgresql/data

volumes:
  dealos_pg:
